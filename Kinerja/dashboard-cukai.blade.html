<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepatuhan Pengguna Jasa di Bidang Cukai</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js & PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-blue: #003F87; 
            --secondary-blue: #1C5AA0; 
            --light-blue: #3A7BD5; 
            --orange: #F7931E; 
            --bg-color: #f4f7f6;
            --white: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        .dashboard-title { text-align: center; color: var(--primary-blue); font-size: 2rem; font-weight: 800; margin-bottom: 20px; }
        
        /* Filter Box */
        .filter-box {
            background: var(--white);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--secondary-blue);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filter-box h3 { margin: 0; color: var(--primary-blue); font-size: 1.1rem; }
        .filter-options { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        
        /* Style Kotak Pencarian */
        .search-input {
            background: var(--white);
            border: 1px solid #ccc;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            color: var(--primary-blue);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            min-width: 200px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-input:focus { 
            border-color: var(--secondary-blue); 
            box-shadow: 0 0 0 2px rgba(28, 90, 160, 0.1);
        }
        .search-input::placeholder {
            color: #888;
            font-weight: 400;
        }

        /* Custom Dropdown Checkbox Style */
        .custom-dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: var(--white);
            border: 1px solid #ccc;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 140px;
            box-sizing: border-box;
            user-select: none;
        }
        .dropdown-btn:hover { border-color: var(--secondary-blue); }
        .dropdown-menu-box {
            display: none;
            position: absolute;
            background: var(--white);
            min-width: 180px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            z-index: 100;
            padding: 10px;
            border: 1px solid #ccc;
            margin-top: 5px;
            max-height: 220px;
            overflow-y: auto;
        }
        .dropdown-menu-box.show { display: block; }
        .dropdown-item-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #333;
            font-weight: 500;
            border-radius: 4px;
        }
        .dropdown-item-label:hover { background-color: #f0f4f8; }

        /* --- Efek Mengembang untuk Card Box --- */
        .card-box {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--secondary-blue);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 63, 135, 0.15);
        }

        .card-title { text-align: center; color: var(--primary-blue); font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; }

        /* Grid Atas: Memastikan kolom kiri dan kanan sama tinggi (stretch) */
        .cukai-top-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr;
            gap: 20px;
            margin-bottom: 10px;
            align-items: stretch; 
        }

        /* Pembungkus kolom kiri dijadikan flexbox vertikal penuh */
        .metrics-column {
            display: flex;
            flex-direction: column;
            gap: 15px; 
            height: 100%;
        }

        .metrics-column .card-box {
            margin-bottom: 0 !important;
            padding: 35px 15px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .metric-label { font-size: 0.85rem; color: #555; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .metric-value { font-size: 2rem; font-weight: 800; color: var(--primary-blue); margin: 0; }
        .metric-value.orange { color: var(--orange); }

        /* Style Tabel Cukai */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px; 
            border: 1px solid #d1d9e6;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        .data-table th, .data-table td {
            border: 1px solid #d1d9e6;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.95rem;
        }
        .data-table th {
            background-color: var(--primary-blue);
            color: var(--white);
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
        }
        .data-table tr:nth-child(even) { background-color: #f9fbfd; }
        .data-table tr:hover { background-color: #f1f5f9; }
        .data-table td.text-center { text-align: center; }

        @media(max-width: 992px) {
            .cukai-top-grid { grid-template-columns: 1fr; }
        }
        @media(max-width: 768px) {
            .filter-box { flex-direction: column; align-items: flex-start; }
            .filter-options { flex-direction: column; align-items: stretch; width: 100%; }
            .custom-dropdown { width: 100%; }
            .dropdown-btn { width: 100%; }
            .search-input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1 class="dashboard-title">Kepatuhan Pengguna Jasa di Bidang Cukai</h1>

        <!-- Filter Box Waktu Dinamis & Search Box -->
        <div class="filter-box">
            <h3>Filter Jatuh Tempo Berdasarkan</h3>
            <div class="filter-options">
                
                <!-- Kotak Search Shortcut -->
                <input type="text" id="searchInput" class="search-input" placeholder="Cari Nama / Perusahaan..." oninput="filterData()">

                <!-- Dropdown Tahun Dinamis -->
                <div class="custom-dropdown">
                    <div class="dropdown-btn" onclick="toggleDropdown('tahun')">
                        <span id="tahunBtnText">Pilih Tahun</span>
                        <i class="fas fa-chevron-down" style="font-size: 0.8rem;"></i>
                    </div>
                    <div class="dropdown-menu-box" id="tahunDropdownMenu">
                        <!-- Terisi otomatis -->
                    </div>
                </div>

                <!-- Dropdown Bulan Dinamis -->
                <div class="custom-dropdown">
                    <div class="dropdown-btn" onclick="toggleDropdown('bulan')">
                        <span id="bulanBtnText">Pilih Bulan</span>
                        <i class="fas fa-chevron-down" style="font-size: 0.8rem;"></i>
                    </div>
                    <div class="dropdown-menu-box" id="bulanDropdownMenu">
                        <!-- Terisi otomatis -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Grid Atas: Metrics & Grafik Lingkaran (Doughnut) -->
        <div class="cukai-top-grid">
            
            <!-- Kolom Metrik Kiri -->
            <div class="metrics-column">
                <div class="card-box">
                    <div class="metric-label">Jumlah NPPBKC</div>
                    <h2 class="metric-value" id="valJumlahNppbkc">0</h2>
                </div>
                <div class="card-box">
                    <div class="metric-label">Terkena STCK</div>
                    <h2 class="metric-value orange" id="valTerkenaStck">0</h2>
                </div>
            </div>

            <!-- Grafik Status NPPBKC -->
            <div class="card-box">
                <div class="card-title">Status NPPBKC</div>
                <div style="position: relative; height: 210px; width: 100%;">
                    <canvas id="statusNppbkcChart"></canvas>
                </div>
            </div>

            <!-- Grafik Jenis Kegiatan Usaha -->
            <div class="card-box">
                <div class="card-title">Jenis Kegiatan Usaha</div>
                <div style="position: relative; height: 210px; width: 100%;">
                    <canvas id="jenisUsahaChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Tabel Daftar Pengguna Jasa Cukai -->
        <div class="card-box">
            <div class="card-title">Daftar Pengguna Jasa Cukai</div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="5%" class="text-center">No</th>
                            <th width="25%">Nama Pemilik</th>
                            <th width="35%">Nama Perusahaan</th>
                            <th width="20%">Tanggal Jatuh Tempo</th>
                            <th width="15%" class="text-center">Sisa Hari</th>
                        </tr>
                    </thead>
                    <tbody id="cukaiTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let globalRawData = [];

        const monthNames = {
            '01': 'Januari', '02': 'Februari', '03': 'Maret', '04': 'April',
            '05': 'Mei', '06': 'Juni', '07': 'Juli', '08': 'Agustus',
            '09': 'September', '10': 'Oktober', '11': 'November', '12': 'Desember'
        };

        const ctxStatus = document.getElementById('statusNppbkcChart').getContext('2d');
        const statusNppbkcChart = new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: ['Aman', 'Segera Perpanjang', 'Kadaluarsa'],
                datasets: [{
                    data: [0, 0, 0],
                    backgroundColor: ['#1C5AA0', '#F7931E', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                }
            }
        });

        const ctxUsaha = document.getElementById('jenisUsahaChart').getContext('2d');
        const jenisUsahaChart = new Chart(ctxUsaha, {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: ['#003F87', '#F7931E', '#3A7BD5', '#2E8B57', '#9370DB']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                }
            }
        });

        const publicCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJIvGZ2s51srep-cgziH6wXTYPKRnMMsm86s3CNgoUAbwmCt6sjHEQRHwFH4TxcMWmCI59V4oakEgh/pub?gid=1670810491&single=true&output=csv';

        function toggleDropdown(type) {
            const tahunMenu = document.getElementById('tahunDropdownMenu');
            const bulanMenu = document.getElementById('bulanDropdownMenu');
            if (type === 'tahun') {
                tahunMenu.classList.toggle('show');
                bulanMenu.classList.remove('show');
            } else {
                bulanMenu.classList.toggle('show');
                tahunMenu.classList.remove('show');
            }
        }

        window.onclick = function(event) {
            if (!event.target.closest('.custom-dropdown')) {
                document.getElementById('tahunDropdownMenu')?.classList.remove('show');
                document.getElementById('bulanDropdownMenu')?.classList.remove('show');
            }
        }

        function parseSlashDate(dateStr) {
            if (!dateStr) return { tahun: '', bulan: '' };
            let cleanStr = String(dateStr).trim();
            let parts = cleanStr.split('/');
            if (parts.length === 3) {
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                let year = parts[2];
                if (year.length === 4 && !isNaN(year) && !isNaN(month)) {
                    return { tahun: year, bulan: month };
                }
            }
            return { tahun: '', bulan: '' };
        }

        function calculateSisaHariDynamic(dateStr) {
            if (!dateStr) return { days: 0, text: '0' };
            let cleanStr = String(dateStr).trim();
            let parts = cleanStr.split('/');
            if (parts.length === 3) {
                let day = parseInt(parts[0], 10);
                let month = parseInt(parts[1], 10) - 1; 
                let year = parseInt(parts[2], 10);

                if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                    let dueDate = new Date(year, month, day);
                    let today = new Date();
                    today.setHours(0, 0, 0, 0);
                    dueDate.setHours(0, 0, 0, 0);

                    let diffTime = dueDate - today;
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return { days: diffDays, text: diffDays.toLocaleString('id-ID') };
                }
            }
            return { days: 0, text: '0' };
        }

        function fetchSheetData() {
            Papa.parse(publicCsvUrl, {
                download: true, header: false, skipEmptyLines: true,
                complete: function(results) {
                    const rawRows = results.data;
                    let cleanedData = [];

                    for (let i = 0; i < rawRows.length; i++) {
                        let row = rawRows[i];
                        
                        let namaPemilik = row[1] ? String(row[1]).trim() : ''; 
                        let namaPerusahaan = row[4] ? String(row[4]).trim() : ''; 
                        let tglJatuhTempo = row[17] ? String(row[17]).trim() : ''; 

                        let lowerOwner = namaPemilik.toLowerCase();
                        let lowerComp = namaPerusahaan.toLowerCase();
                        let lowerDate = tglJatuhTempo.toLowerCase();

                        if (lowerOwner.includes('nama') || lowerComp.includes('perusahaan') || lowerDate.includes('tanggal') || lowerDate.includes('tempo')) {
                            continue;
                        }

                        if (!tglJatuhTempo.includes('/') || !namaPerusahaan || namaPerusahaan === '-' || namaPerusahaan.includes('--')) {
                            continue;
                        }

                        let jenisUsaha = row[5] ? String(row[5]).trim() : 'TPE MMEA';
                        let terkenaStck = row[22] ? String(row[22]).trim() : ''; 

                        let sisaHariObj = calculateSisaHariDynamic(tglJatuhTempo);
                        let cleanSisaHari = sisaHariObj.days;
                        let sisaHariText = sisaHariObj.text;

                        let statusNppbkc = 'Aman';
                        if (cleanSisaHari > 60) {
                            statusNppbkc = 'Aman';
                        } else if (cleanSisaHari >= 1 && cleanSisaHari <= 60) {
                            statusNppbkc = 'Segera Perpanjang';
                        } else {
                            statusNppbkc = 'Kadaluarsa';
                        }

                        let parsedDate = parseSlashDate(tglJatuhTempo);

                        cleanedData.push({
                            namaPemilik,
                            namaPerusahaan,
                            tglJatuhTempo,
                            sisaHariText,
                            cleanSisaHari,
                            statusNppbkc,
                            jenisUsaha,
                            terkenaStck,
                            tahun: parsedDate.tahun,
                            bulan: parsedDate.bulan
                        });
                    }

                    globalRawData = cleanedData;
                    updateYearCheckboxes();
                }
            });
        }

        function getSelectedYears() {
            return Array.from(document.querySelectorAll('#tahunDropdownMenu input[type="checkbox"]:checked')).map(cb => cb.value);
        }
        function getSelectedMonths() {
            return Array.from(document.querySelectorAll('#bulanDropdownMenu input[type="checkbox"]:checked')).map(cb => cb.value);
        }

        function updateYearCheckboxes() {
            const tahunMenu = document.getElementById('tahunDropdownMenu');
            const previouslyChecked = getSelectedYears();
            tahunMenu.innerHTML = '';
            
            let availableYears = new Set();
            globalRawData.forEach(row => { if (row.tahun) availableYears.add(row.tahun); });
            let sortedYears = Array.from(availableYears).sort();

            if (sortedYears.length === 0) {
                tahunMenu.innerHTML = '<span style="padding: 6px 10px; color: #666; font-size:0.9rem;">Tidak ada tahun</span>';
                return;
            }

            sortedYears.forEach(y => {
                let isChecked = previouslyChecked.length === 0 || previouslyChecked.includes(y);
                tahunMenu.innerHTML += `<label class="dropdown-item-label"><input type="checkbox" name="filterTahun" value="${y}" ${isChecked ? 'checked' : ''} onchange="onYearChange()"> ${y}</label>`;
            });

            updateMonthCheckboxes();
        }

        function updateMonthCheckboxes() {
            const bulanMenu = document.getElementById('bulanDropdownMenu');
            const previouslyChecked = getSelectedMonths();
            bulanMenu.innerHTML = '';
            
            let selectedYears = getSelectedYears();
            let availableMonths = new Set();
            
            globalRawData.forEach(row => { 
                if (selectedYears.includes(row.tahun) && row.bulan) {
                    availableMonths.add(row.bulan); 
                } 
            });
            
            let sortedMonths = Array.from(availableMonths).sort();

            if (sortedMonths.length === 0) {
                bulanMenu.innerHTML = '<span style="padding: 6px 10px; color: #666; font-size:0.9rem;">Tidak ada bulan</span>';
                updateButtonLabels();
                processAndRender();
                return;
            }

            sortedMonths.forEach(m => {
                let isChecked = previouslyChecked.length === 0 || previouslyChecked.includes(m);
                bulanMenu.innerHTML += `<label class="dropdown-item-label"><input type="checkbox" name="filterBulan" value="${m}" ${isChecked ? 'checked' : ''} onchange="filterData()"> ${monthNames[m] || m}</label>`;
            });
            
            updateButtonLabels();
            processAndRender();
        }

        function updateButtonLabels() {
            let selectedYears = getSelectedYears();
            document.getElementById('tahunBtnText').textContent = selectedYears.length === 0 ? 'Pilih Tahun' : (selectedYears.length === document.querySelectorAll('#tahunDropdownMenu input[type="checkbox"]').length ? 'Semua Tahun' : 'Tahun: ' + selectedYears.join(', '));
            
            let selectedMonths = getSelectedMonths();
            let totalBulan = document.querySelectorAll('#bulanDropdownMenu input[type="checkbox"]').length;
            document.getElementById('bulanBtnText').textContent = (selectedMonths.length === 0 || selectedMonths.length === totalBulan) ? 'Semua Bulan' : 'Bulan: ' + selectedMonths.map(m => (monthNames[m] || m).substring(0, 3)).join(', ');
        }

        function onYearChange() { updateMonthCheckboxes(); filterData(); }
        function filterData() { updateButtonLabels(); processAndRender(); }

        function processAndRender() {
            const selectedYears = getSelectedYears();
            const selectedMonths = getSelectedMonths();
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            let filteredRows = [];
            let statusCounts = { 'Aman': 0, 'Segera Perpanjang': 0, 'Kadaluarsa': 0 };
            let usahaCounts = {};
            let totalStck = 0;

            globalRawData.forEach(row => {
                if (row.tahun && !selectedYears.includes(row.tahun)) return;
                if (row.bulan && !selectedMonths.includes(row.bulan)) return;

                // Filter Pencarian Nama Pemilik atau Nama Perusahaan
                if (searchQuery) {
                    let matchOwner = row.namaPemilik.toLowerCase().includes(searchQuery);
                    let matchComp = row.namaPerusahaan.toLowerCase().includes(searchQuery);
                    if (!matchOwner && !matchComp) return;
                }

                filteredRows.push(row);

                if (statusCounts[row.statusNppbkc] !== undefined) {
                    statusCounts[row.statusNppbkc]++;
                }

                let usaha = row.jenisUsaha || 'Lainnya';
                usahaCounts[usaha] = (usahaCounts[usaha] || 0) + 1;

                if (row.terkenaStck && row.terkenaStck.toUpperCase().includes('STCK')) {
                    totalStck++;
                }
            });

            document.getElementById('valJumlahNppbkc').innerText = globalRawData.length;
            document.getElementById('valTerkenaStck').innerText = totalStck;

            const tbody = document.getElementById('cukaiTableBody');
            tbody.innerHTML = '';
            if (filteredRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center" style="color: #666; font-style: italic;">Tidak ada data kepatuhan cukai yang tersedia</td></tr>`;
            } else {
                filteredRows.forEach((item, index) => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-center">${index + 1}</td>
                        <td>${item.namaPemilik}</td>
                        <td style="font-weight: 600; color: var(--primary-blue);">${item.namaPerusahaan}</td>
                        <td>${item.tglJatuhTempo}</td>
                        <td class="text-center">${item.sisaHariText}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            statusNppbkcChart.data.labels = Object.keys(statusCounts);
            statusNppbkcChart.data.datasets[0].data = Object.values(statusCounts);
            statusNppbkcChart.update();

            jenisUsahaChart.data.labels = Object.keys(usahaCounts);
            jenisUsahaChart.data.datasets[0].data = Object.values(usahaCounts);
            jenisUsahaChart.update();
        }

        fetchSheetData();
        setInterval(fetchSheetData, 300000);
    </script>
</body>
</html>
